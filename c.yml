---
version: "3"

vars:
  CC: clang
  CC_FLAGS: "-Werror -Wextra -Wall -Wshadow -Wfree-nonheap-object -std=c17 -I/usr/local/include"
  DYN_LIBS_USED_PATH: "-L/usr/local/lib/standardloop"
  TEST_EXECUTABLE_NAME: test
  # DYN_LIBS_USED: "-lstandardloop-logger"
  # SOURCE_FILES:
  #   - todo.c
  # TEST_SOURCE_FILES:
  #   - todo.test.c
  # for releasing
  # DYLIB_NAME: libstandardloop-todo.dylib
  # DYLIB_HEADER: todo.h
  DYLIB_PATH: /usr/local/lib/standardloop/
  DYLIB_INCLUDE_PATH: /usr/local/include/standardloop/

tasks:
  ####################################################### RELEASE ######################################################
  # GH_RELEASE_VERSION is set by CI
  release:
    desc: "Build the dylib."
    run: once
    cmds:
      - |
        {{.CC}} {{.CC_FLAGS}} \
        {{range .SOURCE_FILES}} {{.}} {{end}} \
        {{.DYN_LIBS_USED_PATH}} \
        {{.DYN_LIBS_USED}} \
        -O3 \
        -dynamiclib \
        -current_version {{.GH_RELEASE_VERSION}} \
        -compatibility_version {{.GH_RELEASE_VERSION}} \
        -o {{.DYLIB_NAME}}
    sources:
      - "*.c"
    generates:
      - "{{.DYLIB_NAME}}"
  ####################################################### END ######################################################

  ####################################################### TEST ######################################################
  test:build:
    run: once
    desc: "Build the test program."
    cmds:
      - |
        {{.CC}} {{.CC_FLAGS}} \
        test.c \
        {{range .SOURCE_FILES}} {{.}} {{end}} \
        {{range .TEST_SOURCE_FILES}} {{.}} {{end}} \
        {{.DYN_LIBS_USED_PATH}} \
        {{.DYN_LIBS_USED}} \
        -o {{.TEST_EXECUTABLE_NAME}}
    sources:
      - "*.c"
    generates:
      - "{{.TEST_EXECUTABLE_NAME}}"

  test:build-sanitize:
    desc: "Build the test with address sanitizer on."
    run: once
    cmds:
      - |
        {{.CC}} {{.CC_FLAGS}} \
        test.c \
        {{range .SOURCE_FILES}} {{.}} {{end}} \
        {{range .TEST_SOURCE_FILES}} {{.}} {{end}} \
        {{.DYN_LIBS_USED_PATH}} \
        {{.DYN_LIBS_USED}} \
        -fsanitize=address \
        -fno-omit-frame-pointer \
        -o {{.TEST_EXECUTABLE_NAME}}-sanitize
    sources:
      - "*.c"
    generates:
      - "{{.TEST_EXECUTABLE_NAME}}-sanitize"

  test:clean:
    cmds:
      - rm -f {{.TEST_EXECUTABLE_NAME}}-sanitize
      - rm -f {{.TEST_EXECUTABLE_NAME}}
  ####################################################### END ######################################################

  ####################################################### DEPENDENCIES ######################################################

  dependencies:helper-task:
    internal: true
    cmds:
      - |
        mkdir -p dependencies/tmp-{{.DYLIB_NAME}}
        cd dependencies/tmp-{{.DYLIB_NAME}}
        curl -O -J -L https://github.com/standardloop/{{.REPO_NAME}}/releases/download/v{{.DYLIB_VERSION}}/libstandardloop-{{.DYLIB_NAME}}.zip
        unzip libstandardloop-{{.DYLIB_NAME}}.zip
        sudo mkdir -p /usr/local/lib/standardloop/
        sudo mkdir -p /usr/local/include/standardloop/
        sudo mv libstandardloop-{{.DYLIB_NAME}}.dylib /usr/local/lib/standardloop/
        sudo mv {{.DYLIB_NAME}}.h /usr/local/include/standardloop/ && rm libstandardloop-{{.DYLIB_NAME}}.zip

  dependencies:logger:
    vars:
      REPO_NAME: c-logger
      DYLIB_VERSION: 0.2.1
      DYLIB_NAME: logger
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-logger
          DYLIB_VERSION: 0.2.1
          DYLIB_NAME: logger
    status:
      - otool -L /usr/local/lib/standardloop/libstandardloop-{{.DYLIB_NAME}}.dylib | head -n 2 | tail -n 1 | grep "current version {{.DYLIB_VERSION}}"

  dependencies:logger:latest:
    vars:
      REPO_NAME: c-logger
      DYLIB_VERSION_RAW:
        sh: gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
      DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
      DYLIB_NAME: logger
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-logger
          DYLIB_VERSION_RAW:
            sh: gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
          DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
          DYLIB_NAME: logger
    status:
      - otool -L /usr/local/lib/standardloop/libstandardloop-{{.DYLIB_NAME}}.dylib | head -n 2 | tail -n 1 | grep "current version {{.DYLIB_VERSION}}"

  dependencies:util:
    vars:
      REPO_NAME: c-util
      DYLIB_VERSION: 0.0.8
      DYLIB_NAME: util
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-util
          DYLIB_VERSION: 0.0.8
          DYLIB_NAME: util
    status:
      - otool -L /usr/local/lib/standardloop/libstandardloop-{{.DYLIB_NAME}}.dylib | head -n 2 | tail -n 1 | grep "current version {{.DYLIB_VERSION}}"

  dependencies:util:latest:
    vars:
      REPO_NAME: c-util
      DYLIB_VERSION_RAW:
        sh: gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
      DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
      DYLIB_NAME: util
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-util
          DYLIB_VERSION_RAW:
            sh: gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
          DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
          DYLIB_NAME: util
    status:
      - otool -L /usr/local/lib/standardloop/libstandardloop-{{.DYLIB_NAME}}.dylib | head -n 2 | tail -n 1 | grep "current version {{.DYLIB_VERSION}}"

  dependencies:collections:
    vars:
      REPO_NAME: c-collections
      DYLIB_VERSION: 0.0.3
      DYLIB_NAME: collections
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-collections
          DYLIB_VERSION: 0.0.3
          DYLIB_NAME: collections
    status:
      - otool -L /usr/local/lib/standardloop/libstandardloop-{{.DYLIB_NAME}}.dylib | head -n 2 | tail -n 1 | grep "current version {{.DYLIB_VERSION}}"

  dependencies:collections:latest:
    vars:
      REPO_NAME: c-collections
      DYLIB_VERSION_RAW:
        sh: gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
      DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
      DYLIB_NAME: collections
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-collections
          DYLIB_VERSION_RAW:
            sh: gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
          DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
          DYLIB_NAME: collections
    status:
      - otool -L /usr/local/lib/standardloop/libstandardloop-{{.DYLIB_NAME}}.dylib | head -n 2 | tail -n 1 | grep "current version {{.DYLIB_VERSION}}"

  dependencies:json:latest:
    vars:
      REPO_NAME: c-json
      DYLIB_VERSION_RAW:
        sh: gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
      DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
      DYLIB_NAME: json
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-json
          DYLIB_VERSION_RAW:
            sh: gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
          DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
          DYLIB_NAME: json
    status:
      - otool -L /usr/local/lib/standardloop/libstandardloop-{{.DYLIB_NAME}}.dylib | head -n 2 | tail -n 1 | grep "current version {{.DYLIB_VERSION}}"
  ####################################################### END ######################################################

  ####################################################### FMT ######################################################
  fmt:
    silent: true
    cmds:
      - find . \( -name "*.c" -o -name "*.h" \) -exec clang-format -style=file -i {} +
  ####################################################### END ######################################################

  ####################################################### DOCS ######################################################
  docs:
    deps:
      - docs:moxygen

  docs:doxygen:
    desc: "https://www.doxygen.nl/"
    cmds:
      - doxygen Doxyfile

  docs:moxygen:
    desc: "https://0state.com/moxygen"
    deps:
      - docs:doxygen
    cmds:
      - moxygen doxygen/xml/ --output docs/index.md --quiet --language cpp
      - sed -i '' '/^Defined in /d' docs/index.md
      - sed -i '' 's/#include <\(.*\)>/#include <standardloop\/\1>/g' docs/index.md
      - sed -i '' '/^Generated by \[Moxygen\](https:\/\/0state\.com\/moxygen)$/d' docs/index.md
      - npx prettier --write docs/index.md --log-level silent
  ####################################################### END ######################################################
