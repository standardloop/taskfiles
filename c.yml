---
version: "3"

vars:
  CC: clang
  CC_FLAGS: "-Werror -Wextra -Wall -Wshadow -Wfree-nonheap-object -std=c17 -I/usr/local/include"
  DYN_LIBS_USED_PATH: "-L/usr/local/lib/standardloop"
  TEST_EXECUTABLE_NAME: test
  # DYN_LIBS_USED: "-lstandardloop-logger"
  # SOURCE_FILES:
  #   - todo.c
  # TEST_SOURCE_FILES:
  #   - todo.test.c
  # for releasing
  # DYLIB_NAME: libstandardloop-todo.dylib
  # DYLIB_HEADER: todo.h
  DYLIB_PATH: /usr/local/lib/standardloop/
  DYLIB_INCLUDE_PATH: /usr/local/include/standardloop/

tasks:
  ####################################################### RELEASE ######################################################
  # GH_RELEASE_VERSION is set by CI
  release:
    desc: "Build the dylib."
    run: once
    cmds:
      - echo "{{.CI}}"
      - |
        {{.CC}} {{.CC_FLAGS}} \
        {{range .SOURCE_FILES}} {{.}} {{end}} \
        {{.DYN_LIBS_USED_PATH}} \
        {{.DYN_LIBS_USED}} \
        -O3 \
        -dynamiclib \
        -current_version {{.GH_RELEASE_VERSION}} \
        -compatibility_version {{.GH_RELEASE_VERSION}} \
        -o {{.DYLIB_NAME}}
    sources:
      - "*.c"
    generates:
      - "{{.DYLIB_NAME}}"
  ####################################################### END ######################################################

  ####################################################### TEST ######################################################
  test:build:
    run: once
    desc: "Build the test program."
    cmds:
      - |
        {{.CC}} {{.CC_FLAGS}} \
        test.c \
        {{range .SOURCE_FILES}} {{.}} {{end}} \
        {{range .TEST_SOURCE_FILES}} {{.}} {{end}} \
        {{.DYN_LIBS_USED_PATH}} \
        {{.DYN_LIBS_USED}} \
        -o {{.TEST_EXECUTABLE_NAME}}
    sources:
      - "*.c"
    generates:
      - "{{.TEST_EXECUTABLE_NAME}}"

  test:build-sanitize:
    desc: "Build the test with address sanitizer on."
    run: once
    cmds:
      - |
        {{.CC}} {{.CC_FLAGS}} \
        test.c \
        {{range .SOURCE_FILES}} {{.}} {{end}} \
        {{range .TEST_SOURCE_FILES}} {{.}} {{end}} \
        {{.DYN_LIBS_USED_PATH}} \
        {{.DYN_LIBS_USED}} \
        -fsanitize=address \
        -fno-omit-frame-pointer \
        -o {{.TEST_EXECUTABLE_NAME}}-sanitize
    sources:
      - "*.c"
    generates:
      - "{{.TEST_EXECUTABLE_NAME}}-sanitize"

  test:clean:
    cmds:
      - rm -f {{.TEST_EXECUTABLE_NAME}}-sanitize
      - rm -f {{.TEST_EXECUTABLE_NAME}}
  ####################################################### END ######################################################

  ####################################################### DEPENDENCIES ######################################################

  dependencies:helper-task:
    internal: true
    cmds:
      - |
        mkdir -p dependencies/tmp-{{.DYLIB_NAME}}
        cd dependencies/tmp-{{.DYLIB_NAME}}
        curl -O -J -L https://github.com/standardloop/{{.REPO_NAME}}/releases/download/v{{.DYLIB_VERSION}}/libstandardloop-{{.DYLIB_NAME}}.zip
        unzip libstandardloop-{{.DYLIB_NAME}}.zip
        sudo mkdir -p /usr/local/lib/standardloop/
        sudo mkdir -p /usr/local/include/standardloop/
        sudo mv libstandardloop-{{.DYLIB_NAME}}.dylib /usr/local/lib/standardloop/
        sudo mv {{.DYLIB_NAME}}.h /usr/local/include/standardloop/ && rm libstandardloop-{{.DYLIB_NAME}}.zip

  dependencies:logger:
    vars:
      REPO_NAME: c-logger
      DYLIB_VERSION: 0.3.0
      DYLIB_NAME: logger
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-logger
          DYLIB_VERSION: 0.3.0
          DYLIB_NAME: logger
    status:
      - otool -L /usr/local/lib/standardloop/libstandardloop-{{.DYLIB_NAME}}.dylib | head -n 2 | tail -n 1 | grep "current version {{.DYLIB_VERSION}}"

  dependencies:logger:latest:
    vars:
      REPO_NAME: c-logger
      DYLIB_VERSION_RAW:
        sh: >
          if [ -n "$CI" ]; then
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/standardloop/{{.REPO_NAME}}/releases/latest | jq -r .tag_name
          else
            gh release list --repo standardloop/{{.REPO_NAME}} --limit 1 --json tagName --jq '.[0].tagName'
          fi
      DYLIB_VERSION: '{{ trimPrefix "v" .DYLIB_VERSION_RAW }}'
      DYLIB_NAME: logger
    cmds:
      - sudo -v
      - task: dependencies:helper-task
        vars:
          REPO_NAME: c-logger
          DYLIB_VERSION_RAW:
            sh: >
              if [ -n "$CI" ]; then
