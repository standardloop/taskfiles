  ####################################################### FMT ######################################################
  fmt:
    silent: true
    cmds:
      - find . \( -name "*.c" -o -name "*.h" \) -exec clang-format -style=file -i {} +
  ####################################################### END ######################################################

  ####################################################### DOCS ######################################################
  docs:
    deps:
      - task: docs:moxygen
      - task: docs:readme

  docs:doxygen:
    desc: "https://www.doxygen.nl/"
    cmds:
      - mkdir -p doxygen/html
      - mkdir -p doxygen/xml
      - doxygen Doxyfile

  docs:moxygen:
    desc: "https://0state.com/moxygen"
    deps:
      - docs:doxygen
    cmds:
      - moxygen doxygen/xml/ --output docs/index.md --quiet --language cpp
      - sed -i '' '/^Defined in /d' docs/index.md
      - sed -i '' 's/#include <\(.*\)>/#include <standardloop\/\1>/g' docs/index.md
      - sed -i '' '/^Generated by \[Moxygen\](https:\/\/0state\.com\/moxygen)$/d' docs/index.md
      - npx prettier --write docs/index.md --log-level silent

  docs:readme:
    cmds:
      - |
        perl -i -0777 -pe '
          BEGIN {
            my $yaml = `yq '\''(.tasks // {}) | to_entries | .[] | .key + "\t" + (.value.desc // "")'\'' Taskfile.yml`;
            my @lines = split("\n", $yaml);

            # Find the longest task key length dynamically
            my $max_len = 0;
            for (@lines) {
              my ($k) = split(/\t/);
              $max_len = length($k) if length($k) >$max_len;
            }

            # Format lines with dynamic sprintf padding
            my $formatted = "task: Available tasks for this project:\n";
            for (@lines) {
              my ($k,$d) = split(/\t/);
              $formatted .= sprintf("* \%-*s \%s\n", $max_len + 2, $k,$d);
            }

            $block = "```sh\n${formatted}```";
          }
          s/(<!-- TASKS_START -->\n)(.*?)(<!-- TASKS_END -->)/${1}${block}\n${3}/s
        ' README.md
      - npx prettier --write README.md --log-level silent
  ####################################################### END ######################################################
