---
version: '3'

includes:
  color: color.yml
  docker: docker.yml

tasks:
  default:
    aliases: [all]
    silent: true
    deps:
      - start

  start:
    desc: |
      Start Rancher Docker Engine
    run: once
    silent: true
    aliases: [run, deploy, on, init]
    vars:
      FLAGS: '{{.FLAGS | default ""}}'
    cmds:
      - rdctl start --application.start-in-background {{.FLAGS}}
      - task: docker:wait-for-ready
    status:
      - rdctl list-settings > /dev/null 2>&1
      - docker info > /dev/null 2>&1

  clean:
    desc: |
      Shutdown Rancher Docker Engine
    run: once
    aliases: [destroy, shutdown, delete, off, clean]
    cmds:
      - rdctl shutdown
