fail_fast = false

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "trailing-whitespace" }, { id = "end-of-file-fixer" }]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
hooks = [{ id = "yamllint", args = ["--strict"] }]

[[repos]]
repo = "local"
hooks = [
  { id = "task-docs", name = "Docs", entry = "task docs", language = "system", pass_filenames = false },
]
