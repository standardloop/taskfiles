---
version: '3'

includes:
  rancher: ../rancher.yml

env:
  DOCKER_ENGINE_CPUS: 4
  DOCKER_ENGINE_MEMORY: 8

tasks:
  default:
    silent: true
    cmds:
      - task: rancher:start
        vars:
          FLAGS: "--virtual-machine.number-cpus {{.DOCKER_ENGINE_CPUS}} --virtual-machine.memory-in-gb {{.DOCKER_ENGINE_MEMORY}}"
  clean:
    cmds:
      - task: rancher:clean
